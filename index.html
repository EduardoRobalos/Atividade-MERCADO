<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gerenciador de Mercado</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>Gerenciador de Mercado</header>

  <div class="container">

    <div class="top-actions">
      <button class="btn btn-add" id="openFormBtn" type="button">+ Adicionar Produto</button>
    </div>

    <div class="modal" id="contactModal">
      <div class="modal-content">
        <button class="close" id="closeFormBtn">&times;</button>
        <h2 id="modalTitle">Adicionar Produto</h2>
        
        <form id="productForm">
          <input type="hidden" id="editIndex">
          <input type="text" id="nome" placeholder="Nome do produto" required />
          <input type="text" id="categoria" placeholder="Categoria" required />
          <input type="number" id="preco" placeholder="Preço (R$)" required step="0.01" min="0" />
          <input type="number" id="estoque" placeholder="Estoque" required />
          <button type="submit" class="btn btn-add" style="width:100%;">Salvar</button>
        </form>
      </div>
    </div>

    <h2> Lista de Produtos</h2>
   
    <table id="productTable">
      <thead>
        <tr>
          <th>Produto</th>
          <th>Categoria</th>
          <th>Preço</th>
          <th>Estoque</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <div class="row">
      <div class="card">
        <h3>Gerenciar Produtos</h3>
        <button class="btn btn-edit" type="button" onclick="listarProdutosPorCategoria()">Listar Produtos</button>
        <ul id="lista-produto"></ul>
  </div>

  <script src="scriptAvaliacoes.js">

  </script>
</body>
</html>
